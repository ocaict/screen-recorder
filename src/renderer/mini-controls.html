<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>OcaTech Mini Controls</title>
    <link rel="stylesheet" href="mini-controls.css">
</head>

<body class="mini-controls-body">
    <div class="mini-toolbar" id="miniToolbar">
        <div class="drag-handle" title="Drag to move">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="5" r="1" />
                <circle cx="9" cy="12" r="1" />
                <circle cx="9" cy="19" r="1" />
                <circle cx="15" cy="5" r="1" />
                <circle cx="15" cy="12" r="1" />
                <circle cx="15" cy="19" r="1" />
            </svg>
        </div>

        <button class="mini-btn collapse-btn" id="miniCollapseBtn" title="Focus Mode (F)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                id="collapseIcon">
                <path d="M15 18l-6-6 6-6" />
            </svg>
        </button>

        <!-- Live Timer -->
        <div class="timer-container">
            <div class="recording-status pulse" id="recordingStatus"></div>
            <span class="status-label" id="statusLabel">LIVE</span>
            <span class="timer-text" id="miniTimer">00:00:00</span>
        </div>

        <div class="divider"></div>

        <!-- Main Controls -->
        <div class="controls-group">
            <button class="mini-btn" id="miniPauseBtn" title="Pause/Resume (P)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    id="pauseIcon">
                    <rect x="6" y="4" width="4" height="16" />
                    <rect x="14" y="4" width="4" height="16" />
                </svg>
            </button>

            <button class="mini-btn stop-btn" id="miniStopBtn" title="Stop Recording (S)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                </svg>
            </button>
        </div>

        <div class="divider"></div>

        <!-- Toggle Actions -->
        <div class="controls-group">
            <button class="mini-btn" id="miniMicBtn" title="Toggle Microphone (M)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8" />
                </svg>
                <div class="mini-audio-meter" id="miniAudioMeter">
                    <div class="meter-bar"></div>
                </div>
            </button>

            <button class="mini-btn" id="miniSysAudioBtn" title="Toggle System Audio (Y)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14" />
                </svg>
            </button>

            <button class="mini-btn" id="miniWebcamBtn" title="Toggle Webcam (W)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m22 8-6 4 6 4V8Z" />
                    <rect width="14" height="12" x="2" y="6" rx="2" ry="2" />
                </svg>
            </button>

            <button class="mini-btn" id="miniPresenterBtn" title="Toggle Presenter Mode (C)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </button>


            <button class="mini-btn" id="miniDrawBtn" title="Toggle Annotations (D)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 19l7-7 3 3-7 7-3-3z" />
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
                    <path d="M2 2l5 5" />
                    <path d="M11 11l5 5" />
                </svg>
            </button>
        </div>

        <div class="divider"></div>

        <!-- Window Actions -->
        <button class="mini-btn" id="miniCloseBtn" title="Hide/Close (Esc)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <script src="mini-controls.js"></script>
</body>

</html>
