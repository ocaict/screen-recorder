<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>Annotation Palette</title>
    <link rel="stylesheet" href="annotation-palette.css">
</head>

<body>
    <div class="annotation-toolbar" id="annotationToolbar">
        <div class="drag-handle" title="Drag to move">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="5" r="1" />
                <circle cx="9" cy="12" r="1" />
                <circle cx="9" cy="19" r="1" />
                <circle cx="15" cy="5" r="1" />
                <circle cx="15" cy="12" r="1" />
                <circle cx="15" cy="19" r="1" />
            </svg>
        </div>

        <div class="tools-group">
            <button class="tool-btn active" data-tool="pen" title="Pen (P)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 19l7-7 3 3-7 7-3-3z" />
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
                    <path d="M2 2l7.586 7.586" />
                </svg>
            </button>
            <button class="tool-btn" data-tool="highlighter" title="Highlighter (H)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 11l-6 6v3h9l3-3" />
                    <path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4" />
                </svg>
            </button>
            <button class="tool-btn" data-tool="arrow" title="Arrow (A)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </button>
            <button class="tool-btn" data-tool="double-arrow" title="Double Arrow">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 12H7M7 12l4-4M7 12l4 4M17 12l-4-4M17 12l4 4" />
                </svg>
            </button>
            <button class="tool-btn" data-tool="laser" title="Laser Pointer (L)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <path d="M10 10l-6 6" />
                    <circle cx="12" cy="8" r="2" fill="currentColor" />
                    <path d="M15 5l1 1M18 8l1 1M15 11l1-1M12 2v2" />
                </svg>
            </button>
            <button class="tool-btn" data-tool="rectangle" title="Rectangle (R)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                </svg>
            </button>
            <button class="tool-btn" data-tool="ellipse" title="Ellipse (E)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <ellipse cx="12" cy="12" rx="10" ry="8" />
                </svg>
            </button>
            <button class="tool-btn" data-tool="text" title="Text (T)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="4 7 4 4 20 4 20 7" />
                    <line x1="9" y1="20" x2="15" y2="20" />
                    <line x1="12" y1="4" x2="12" y2="20" />
                </svg>
            </button>
        </div>

        <div class="divider"></div>

        <div class="colors-group">
            <button class="color-btn active" data-color="#ff0000" style="--btn-color: #ff0000;"></button>
            <button class="color-btn" data-color="#00ff00" style="--btn-color: #00ff00;"></button>
            <button class="color-btn" data-color="#0000ff" style="--btn-color: #0000ff;"></button>
            <button class="color-btn" data-color="#ffff00" style="--btn-color: #ffff00;"></button>
            <button class="color-btn" data-color="#ffffff" style="--btn-color: #ffffff;"></button>
            <button class="color-btn" data-color="#000000" style="--btn-color: #000000;"></button>
        </div>

        <div class="divider"></div>

        <div class="actions-group">
            <button class="action-btn" id="undoBtn" title="Undo (Ctrl+Z)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7v6h6" />
                    <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" />
                </svg>
            </button>
            <button class="action-btn" id="clearBtn" title="Clear All (C)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                </svg>
            </button>
            <button class="action-btn close-btn" id="closeBtn" title="Exit Annotation (Esc)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>
    <script src="annotation-palette.js"></script>
</body>

</html>
