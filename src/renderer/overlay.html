<!DOCTYPE html>
<html>

<head>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
        }

        #annotationCanvas,
        #tempCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* When active, capture mouse events */
        body.is-drawing {
            cursor: crosshair !important;
            pointer-events: auto !important;
            background: rgba(0, 0, 0, 0.01) !important;
        }

        body.is-drawing #annotationCanvas,
        body.is-drawing #tempCanvas {
            pointer-events: auto !important;
        }
    </style>
</head>

<body>
    <!-- Persistent drawings -->
    <canvas id="annotationCanvas"></canvas>
    <!-- Active stroke drawing -->
    <canvas id="tempCanvas"></canvas>

    <script src="overlay.js"></script>
</body>

</html>
