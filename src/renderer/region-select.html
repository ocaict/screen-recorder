<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Region</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      cursor: crosshair;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
    }
    
    #selection {
      position: absolute;
      border: 2px solid #00a8ff;
      background: transparent;
      display: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
    }
    
    #selection::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border: 2px dashed white;
      pointer-events: none;
    }
    
    .dimension-label {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: #00a8ff;
      color: white;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }
    
    .corner {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #00a8ff;
      border: 2px solid white;
      border-radius: 2px;
    }
    
    .corner-tl { top: -7px; left: -7px; cursor: nwse-resize; }
    .corner-tr { top: -7px; right: -7px; cursor: nesw-resize; }
    .corner-bl { bottom: -7px; left: -7px; cursor: nesw-resize; }
    .corner-br { bottom: -7px; right: -7px; cursor: nwse-resize; }
    
    #instructions {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      z-index: 1000;
    }
    
    #instructions kbd {
      background: #333;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #555;
    }
    
    #actions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 12px;
      z-index: 1000;
    }
    
    #actions button {
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    #btn-confirm {
      background: #00a8ff;
      color: white;
    }
    
    #btn-confirm:hover {
      background: #0088cc;
    }
    
    #btn-cancel {
      background: #666;
      color: white;
    }
    
    #btn-cancel:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <div id="selection">
    <div class="dimension-label" id="dimensionLabel">0 x 0</div>
    <div class="corner corner-tl" data-corner="tl"></div>
    <div class="corner corner-tr" data-corner="tr"></div>
    <div class="corner corner-bl" data-corner="bl"></div>
    <div class="corner corner-br" data-corner="br"></div>
  </div>
  
  <div id="instructions">
    Click and drag to select a region. Press <kbd>Esc</kbd> to cancel.
  </div>
  
  <div id="actions">
    <button id="btn-confirm">Confirm Selection</button>
    <button id="btn-cancel">Cancel</button>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const selection = document.getElementById('selection');
    const dimensionLabel = document.getElementById('dimensionLabel');
    const instructions = document.getElementById('instructions');
    const actions = document.getElementById('actions');
    const btnConfirm = document.getElementById('btn-confirm');
    const btnCancel = document.getElementById('btn-cancel');
    
    let isDragging = false;
    let startX, startY;
    let region = { x: 0, y: 0, width: 0, height: 0 };
    let activeCorner = null;
    
    overlay.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      
      region = { x: startX, y: startY, width: 0, height: 0 };
      
      selection.style.left = startX + 'px';
      selection.style.top = startY + 'px';
      selection.style.width = '0px';
      selection.style.height = '0px';
      selection.style.display = 'block';
      
      instructions.style.display = 'none';
      actions.style.display = 'none';
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      
      const currentX = e.clientX;
      const currentY = e.clientY;
      
      const left = Math.min(startX, currentX);
      const top = Math.min(startY, currentY);
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);
      
      region = { x: left, y: top, width, height };
      
      selection.style.left = left + 'px';
      selection.style.top = top + 'px';
      selection.style.width = width + 'px';
      selection.style.height = height + 'px';
      
      dimensionLabel.textContent = `${Math.round(width)} x ${Math.round(height)}`;
    });
    
    document.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      
      if (region.width > 10 && region.height > 10) {
        actions.style.display = 'flex';
      } else {
        selection.style.display = 'none';
        instructions.style.display = 'block';
      }
    });
    
    document.querySelectorAll('.corner').forEach(corner => {
      corner.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        activeCorner = corner.dataset.corner;
        
        document.addEventListener('mousemove', resizeCorner);
        document.addEventListener('mouseup', stopResize);
      });
    });
    
    function resizeCorner(e) {
      if (!activeCorner) return;
      
      const rect = selection.getBoundingClientRect();
      let newX = region.x;
      let newY = region.y;
      let newWidth = region.width;
      let newHeight = region.height;
      
      if (activeCorner.includes('r')) {
        newWidth = e.clientX - region.x;
      }
      if (activeCorner.includes('l')) {
        newWidth = region.width + (region.x - e.clientX);
        newX = e.clientX;
      }
      if (activeCorner.includes('b')) {
        newHeight = e.clientY - region.y;
      }
      if (activeCorner.includes('t')) {
        newHeight = region.height + (region.y - e.clientY);
        newY = e.clientY;
      }
      
      if (newWidth > 10 && newHeight > 10) {
        region = { x: newX, y: newY, width: newWidth, height: newHeight };
        
        selection.style.left = newX + 'px';
        selection.style.top = newY + 'px';
        selection.style.width = newWidth + 'px';
        selection.style.height = newHeight + 'px';
        
        dimensionLabel.textContent = `${Math.round(newWidth)} x ${Math.round(newHeight)}`;
      }
    }
    
    function stopResize() {
      activeCorner = null;
      document.removeEventListener('mousemove', resizeCorner);
      document.removeEventListener('mouseup', stopResize);
    }
    
    btnConfirm.addEventListener('click', () => {
      const displayWidth = window.innerWidth;
      const displayHeight = window.innerHeight;
      
      const scaleX = window.innerWidth / document.body.offsetWidth;
      const scaleY = window.innerHeight / document.body.offsetHeight;
      
      const finalRegion = {
        x: Math.round(region.x * scaleX),
        y: Math.round(region.y * scaleY),
        width: Math.round(region.width * scaleX),
        height: Math.round(region.height * scaleY)
      };
      
      const { ipcRenderer } = require('electron');
      ipcRenderer.send('region-selected-result', finalRegion);
    });
    
    btnConfirm.addEventListener('click', () => {
      const scaleX = window.innerWidth / document.body.offsetWidth;
      const scaleY = window.innerHeight / document.body.offsetHeight;
      
      const finalRegion = {
        x: Math.round(region.x * scaleX),
        y: Math.round(region.y * scaleY),
        width: Math.round(region.width * scaleX),
        height: Math.round(region.height * scaleY)
      };
      
      const { ipcRenderer } = require('electron');
      ipcRenderer.send('region-selected-result', finalRegion);
    });
    
    btnCancel.addEventListener('click', () => {
      const { ipcRenderer } = require('electron');
      ipcRenderer.send('region-cancelled-result');
    });
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const { ipcRenderer } = require('electron');
        ipcRenderer.send('region-cancelled-result');
      } else if (e.key === 'Enter' && actions.style.display !== 'none') {
        btnConfirm.click();
      }
    });
  </script>
</body>
</html>
