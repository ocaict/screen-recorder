<!DOCTYPE html>
<html>

<head>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
        }

        #border {
            position: absolute;
            box-sizing: border-box;
            border: 3px solid #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5), inset 0 0 10px rgba(255, 0, 0, 0.3);
            border-radius: 4px;
            pointer-events: none;
            animation: pulse 2s infinite;
            display: none;
        }

        @keyframes pulse {
            0% {
                opacity: 0.8;
                border-color: #ff0000;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                border-color: #ff4d4d;
                transform: scale(1.002);
            }

            100% {
                opacity: 0.8;
                border-color: #ff0000;
                transform: scale(1);
            }
        }

        .indicator-label {
            position: absolute;
            top: -30px;
            left: 0;
            background: #ff0000;
            color: white;
            padding: 2px 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px 4px 0 0;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div id="border">
        <div class="indicator-label">RECORDING REGION</div>
    </div>

    <script>
        const border = document.getElementById('border');

        window.electronAPI.onRegionUpdate((region) => {
            if (region && region.width && region.height) {
                const dpr = window.devicePixelRatio || 1;
                border.style.left = (region.x / dpr) + 'px';
                border.style.top = (region.y / dpr) + 'px';
                border.style.width = (region.width / dpr) + 'px';
                border.style.height = (region.height / dpr) + 'px';
                border.style.display = 'block';
            } else {
                border.style.display = 'none';
            }
        });

        // Handle high-dpi scaling if needed
        window.electronAPI.onInit(({ scaleFactor }) => {
            // Logic for scaling if we use display-relative coords
        });
    </script>
</body>

</html>
